    <polygon points="0,-109.083 54,-77.917 54,-15.583 0,15.583 -54,-15.583 -54,-77.917" fill="#F5B2BF"/>
    <polygon points="216,-109.083 270,-77.917 270,-15.583 216,15.583 162,-15.583 162,-77.917" fill="#F5B2BF"/>


<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <style>
      .icon { fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; opacity: 0.18; }
    </style>
  </defs>
  <!-- Background Pattern Elements -->
  <g class="icon" color="#9CA3AF">
    <!-- Chat bubble 1 -->
    <path d="M40 50 h35 a10 10 0 0 1 10 10 v15 a10 10 0 0 1 -10 10 h-20 l-10 8 v-8 h-5 a10 10 0 0 1 -10 -10 v-15 a10 10 0 0 1 10 -10 z" />
    <circle cx="55" cy="67" r="2" fill="currentColor" />
    <circle cx="67" cy="67" r="2" fill="currentColor" />
    <circle cx="79" cy="67" r="2" fill="currentColor" />

    <!-- Heart -->
    <path d="M150 45 c-6 -10 -20 -10 -26 0 c-6 -10 -20 -10 -26 0 c0 15 26 30 26 30 s26 -15 26 -30 z" />

    <!-- Coffee mug -->
    <path d="M210 50 h24 v22 a8 8 0 0 1 -8 8 h-8 a8 8 0 0 1 -8 -8 z" />
    <path d="M234 56 h6 a4 4 0 0 1 4 4 v4 a4 4 0 0 1 -4 4 h-6" />

    <!-- Camera -->
    <rect x="290" y="52" width="34" height="24" rx="4" />
    <circle cx="307" cy="64" r="6" />
    <circle cx="317" cy="57" r="1.5" fill="currentColor" />
    <path d="M300 52 l3 -4 h8 l3 4" />

    <!-- Paper plane -->
    <path d="M360 40 l-30 20 l12 5 l4 15 l6 -10 l8 2 z" />

    <!-- Star 1 -->
    <path d="M35 150 l3 7 l7 1 l-5 5 l1 7 l-6 -3 l-6 3 l1 -7 l-5 -5 l7 -1 z" />

    <!-- Music note -->
    <circle cx="105" cy="165" r="5" />
    <circle cx="125" cy="155" r="5" />
    <path d="M110 165 v-25 h20 v20" />
    <path d="M110 145 h20" stroke-width="2" />

    <!-- Headphones -->
    <path d="M180 160 a20 20 0 0 1 40 0 v12 h-6 a4 4 0 0 1 -4 -4 v-6 a4 4 0 0 1 4 -4 h6" />
    <path d="M220 160 v12 h-6 a4 4 0 0 1 -4 -4 v-6 a4 4 0 0 1 4 -4 h6" />

    <!-- Lightbulb -->
    <path d="M280 145 a12 12 0 0 1 18 10 c0 4 -3 8 -5 10 v4 h-8 v-4 c-2 -2 -5 -6 -5 -10 a12 12 0 0 1 0 0 z" />
    <line x1="287" y1="173" x2="291" y2="173" />

    <!-- Sun / Flower -->
    <circle cx="360" cy="160" r="8" />
    <line x1="360" y1="146" x2="360" y2="150" />
    <line x1="360" y1="170" x2="360" y2="174" />
    <line x1="346" y1="160" x2="350" y2="160" />
    <line x1="370" y1="160" x2="374" y2="160" />

    <!-- Rocket -->
    <path d="M55 240 c5 -15 20 -20 25 -20 c0 5 -5 20 -20 25 l-5 -5 z" />
    <circle cx="70" cy="227" r="2.5" />
    <path d="M53 243 l-7 7 l5 -2 l2 5 z" />

    <!-- Clock -->
    <circle cx="130" cy="250" r="14" />
    <polyline points="130,242 130,250 136,250" />

    <!-- Game controller -->
    <rect x="200" y="240" width="36" height="20" rx="8" />
    <line x1="208" y1="250" x2="216" y2="250" />
    <line x1="212" y1="246" x2="212" y2="254" />
    <circle cx="226" cy="248" r="1.5" fill="currentColor" />
    <circle cx="230" cy="252" r="1.5" fill="currentColor" />

    <!-- Compass / Compass star -->
    <circle cx="300" cy="250" r="12" />
    <polygon points="300,242 303,249 310,250 303,251 300,258 297,251 290,250 297,249" fill="currentColor" fill-opacity="0.1" />

    <!-- Umbrella -->
    <path d="M350 260 a18 18 0 0 1 36 0 z" />
    <line x1="368" y1="242" x2="368" y2="266" />
    <path d="M368 266 a4 4 0 0 0 4 4" />

    <!-- Sparkles -->
    <path d="M45 340 q5 -10 10 -10 q-5 -10 -10 -10 q-5 10 -10 10 q5 10 10 10" />
    <path d="M62 335 q3 -5 5 -5 q-3 -5 -5 -5 q-3 5 -5 5 q3 5 5 5" />

    <!-- Smile emoji -->
    <circle cx="120" cy="340" r="14" />
    <circle cx="115" cy="336" r="1.5" fill="currentColor" />
    <circle cx="125" cy="336" r="1.5" fill="currentColor" />
    <path d="M114 344 q6 6 12 0" />

    <!-- Envelope -->
    <rect x="195" y="330" width="30" height="20" rx="3" />
    <polyline points="195,332 210,342 225,332" />

    <!-- Tree / Leaf -->
    <path d="M280 345 c-10 -15 0 -25 15 -25 c15 0 25 10 15 25 c-5 8 -15 8 -30 0 z" />
    <line x1="287" y1="337" x2="300" y2="330" />

    <!-- Pin -->
    <path d="M355 330 a8 8 0 0 0 -8 8 c0 6 8 14 8 14 s8 -8 8 -14 a8 8 0 0 0 -8 -8 z" />
    <circle cx="355" cy="338" r="2.5" />
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360" viewBox="0 0 360 360">
  <defs>
    <style>
      .star-line { stroke: #CBD5E1; stroke-width: 0.8; stroke-dasharray: 2 3; opacity: 0.25; }
      .star-dot { fill: #E2E8F0; opacity: 0.6; }
      .star-bright { fill: #F8FAFC; opacity: 0.85; }
      .nebula-ring { fill: none; stroke: #94A3B8; stroke-width: 0.7; opacity: 0.2; }
    </style>
  </defs>

  <!-- Constellation 1: Ursa-like -->
  <polyline points="40,50 85,45 110,75 140,80 170,115 155,145 125,140 110,75" class="star-line" />
  <circle cx="40" cy="50" r="1.8" class="star-dot" />
  <circle cx="85" cy="45" r="2.4" class="star-bright" />
  <circle cx="110" cy="75" r="2.2" class="star-dot" />
  <circle cx="140" cy="80" r="1.8" class="star-dot" />
  <circle cx="170" cy="115" r="2.8" class="star-bright" />
  <circle cx="155" cy="145" r="2.0" class="star-dot" />
  <circle cx="125" cy="140" r="2.0" class="star-dot" />

  <!-- Moon Crescent -->
  <path d="M280 60 A 18 18 0 1 0 298 90 A 14 14 0 1 1 280 60 Z" fill="#E2E8F0" opacity="0.35" />

  <!-- Small Cross Stars -->
  <g opacity="0.4" stroke="#E2E8F0" stroke-width="1">
    <line x1="240" y1="130" x2="240" y2="140" />
    <line x1="235" y1="135" x2="245" y2="135" />

    <line x1="70" y1="260" x2="70" y2="270" />
    <line x1="65" y1="265" x2="75" y2="265" />

    <line x1="310" y1="280" x2="310" y2="288" />
    <line x1="306" y1="284" x2="314" y2="284" />
  </g>

  <!-- Saturn-like Ring Planet -->
  <circle cx="60" cy="170" r="9" fill="#94A3B8" opacity="0.3" />
  <ellipse cx="60" cy="170" rx="18" ry="4" transform="rotate(-25 60 170)" class="nebula-ring" stroke-width="1.2" />

  <!-- Constellation 2: Cassiopeia W -->
  <polyline points="220,210 245,230 270,215 295,240 330,225" class="star-line" />
  <circle cx="220" cy="210" r="2.2" class="star-bright" />
  <circle cx="245" cy="230" r="1.8" class="star-dot" />
  <circle cx="270" cy="215" r="2.5" class="star-bright" />
  <circle cx="295" cy="240" r="2.0" class="star-dot" />
  <circle cx="330" cy="225" r="2.3" class="star-bright" />

  <!-- Constellation 3: Diamond -->
  <polygon points="160,250 185,285 160,320 135,285" class="star-line" />
  <circle cx="160" cy="250" r="2.2" class="star-bright" />
  <circle cx="185" cy="285" r="1.8" class="star-dot" />
  <circle cx="160" cy="320" r="2.2" class="star-bright" />
  <circle cx="135" cy="285" r="1.8" class="star-dot" />

  <!-- Scattered background micro stars -->
  <circle cx="20" cy="90" r="1.2" class="star-dot" />
  <circle cx="190" cy="40" r="1.2" class="star-dot" />
  <circle cx="330" cy="80" r="1.5" class="star-dot" />
  <circle cx="160" cy="180" r="1.0" class="star-dot" />
  <circle cx="220" cy="110" r="1.3" class="star-dot" />
  <circle cx="110" cy="220" r="1.1" class="star-dot" />
  <circle cx="20" cy="330" r="1.4" class="star-dot" />
  <circle cx="250" cy="330" r="1.2" class="star-dot" />
  <circle cx="340" cy="180" r="1.3" class="star-dot" />
  <circle cx="280" cy="160" r="1.0" class="star-dot" />
</svg>
